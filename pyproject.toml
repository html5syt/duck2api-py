[project]
name = "duck2api-py"
version = "1.0.0"
description = "DuckDuckGo AI Chat to OpenAI Compatible API Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"